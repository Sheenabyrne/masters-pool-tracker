<!DOCTYPE html>
<html>
<head>
    <title>Masters Pool Leaderboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b3d2e;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #f7c948;
            margin-bottom: 5px;
        }

        .timestamp {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background-color: white;
            color: black;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #0b3d2e;
            color: #f7c948;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        tr:hover {
            background-color: #e6f2ef;
        }

        /* Updated: removed yellow highlight, kept bold */
        .leader {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🏆 Masters Pool Leaderboard</h1>
    <div class="timestamp">⏱ Last Updated (Newfoundland Time): {{ last_updated }}</div>

    <table>
        <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Total Score</th>
        </tr>

        {% for person in results %}
        <tr class="{% if loop.index == 1 %}leader{% endif %}">
            <td>{{ loop.index }}</td>
            <td>{{ person.name }}</td>
            <td>{{ person.total }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
